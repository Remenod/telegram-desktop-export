# Builds telegram-desktop-export whenever Arch Linux's extra/telegram-desktop
# changes (a new Telegram release or a rebuild against new libraries) and
# updates both AUR packages: telegram-desktop-export (source) and
# telegram-desktop-export-bin (the package built here, from the release).
#
# The repository allows local actions only, so no third-party actions are
# used here: everything is plain shell, git, gh and docker.
name: packaging

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this Arch version was released already
        type: boolean
        default: false
      publish:
        description: Push the result to the AUR
        type: boolean
        default: false
      republish:
        description: Push the existing release of this Arch version to the AUR again, without building
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: packaging
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      mode: ${{ steps.check.outputs.mode }}
      pkgver: ${{ steps.check.outputs.pkgver }}
      pkgrel: ${{ steps.check.outputs.pkgrel }}
    steps:
      - name: Get the packaging scripts
        run: git clone --quiet --depth 1 --branch "${{ github.ref_name }}" "https://github.com/${REPO}.git" packaging
      - name: Keep upstream workflows disabled
        run: python3 packaging/scripts/disable_upstream_workflows.py
      - name: Compare with Arch Linux
        id: check
        run: >-
          python3 packaging/scripts/check.py
          --force "${{ inputs.force || 'false' }}"
          --republish "${{ inputs.republish || 'false' }}"
          | tee -a "$GITHUB_OUTPUT"
      - name: Open or update an issue
        if: failure()
        run: python3 packaging/scripts/report_failure.py

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PKGVER: ${{ needs.check.outputs.pkgver }}
      PKGREL: ${{ needs.check.outputs.pkgrel }}
      MODE: ${{ needs.check.outputs.mode }}
    steps:
      - name: Get the packaging scripts
        run: git clone --quiet --depth 1 --branch "${{ github.ref_name }}" "https://github.com/${REPO}.git" packaging
      - name: Put the patches onto the release
        run: bash packaging/scripts/rebase.sh
      - name: Make PKGBUILDs from Arch's
        run: python3 packaging/scripts/make_pkgbuilds.py
      - name: Free disk space
        if: env.MODE == 'build'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Take the package from the existing release
        if: env.MODE == 'republish'
        run: gh release download "pkg-${PKGVER}-${PKGREL}" --repo "$REPO" --pattern '*.pkg.tar.zst' --dir work/out/telegram-desktop-export
      - name: Build in an Arch Linux container
        run: docker run --rm -e PKGVER -e PKGREL -e REPO -e MODE -v "$PWD:/work" archlinux:base-devel bash /work/packaging/scripts/build.sh
      - name: Make the GitHub release
        if: env.MODE == 'build'
        run: bash packaging/scripts/release.sh
      - name: Publish to the AUR
        if: (github.event_name == 'schedule' && vars.AUR_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.republish))
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: bash packaging/scripts/publish_aur.sh
      - name: Open or update an issue
        if: failure()
        run: python3 packaging/scripts/report_failure.py
